[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "px4rl"
description = "PX4-faithful multirotor control and rotor dynamics for reinforcement learning"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
dynamic = ["version"]
# torch is needed only by px4rl.cuda and px4rl.offboard and is deliberately not a dependency.
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.18"
cmake.build-type = "Release"
cmake.define = { PX4RL_BUILD_PYTHON = "ON", PX4RL_BUILD_TESTS = "OFF" }
# CUDA is opt-in: pip install . -C cmake.define.PX4RL_BUILD_CUDA=ON
wheel.packages = ["python/px4rl"]
# The wheel holds only the Python package, not the C++ headers, static libraries and CMake package files.
install.components = ["python"]
sdist.exclude = ["reference", "experiments", "build"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(px4rl\s+VERSION\s+(?P<value>[0-9][0-9.]*)'

[tool.pytest.ini_options]
testpaths = ["tests/python"]
markers = ["cuda: needs torch and a CUDA device"]
